<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, height=282, initial-scale=1, user-scalable=no">
<title>Neona Test 1</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #cfd8dc; overflow: hidden; }
  body { width: 240px; height: 282px; position: relative; font-family: system-ui, sans-serif; }
  canvas { position: absolute; left: 0; top: 0; width: 240px; height: 282px; }
  #log {
    position: absolute; left: 4px; right: 4px; bottom: 2px;
    font-size: 9px; line-height: 11px; color: #90a4ae;
    white-space: pre; overflow: hidden; height: 66px;
  }
  #top {
    position: absolute; left: 4px; right: 4px; top: 2px;
    font-size: 9px; line-height: 11px; color: #78909c;
  }
</style>
</head>
<body>
<canvas id="c" width="240" height="282"></canvas>
<div id="top">Neona Test 1</div>
<div id="log"></div>

<script>
(function () {
  var W = 240, H = 282;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var logEl = document.getElementById('log');
  var topEl = document.getElementById('top');

  // ---------- Log ----------
  var lines = [];
  function log(msg) {
    lines.push(msg);
    if (lines.length > 6) lines.shift();
    logEl.textContent = lines.join('\n');
  }

  // ---------- Systemcheck ----------
  var webgl = false;
  try {
    var t = document.createElement('canvas');
    webgl = !!(t.getContext('webgl') || t.getContext('experimental-webgl'));
  } catch (e) {}
  var hasMic = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  var hasPlugin = typeof window.PluginMessageHandler !== 'undefined';
  var hasSensors = typeof window.creationSensors !== 'undefined';
  log('WebGL: ' + (webgl ? 'ja' : 'nein'));
  log('Mikro-API: ' + (hasMic ? 'ja' : 'nein'));
  log('PluginMsg: ' + (hasPlugin ? 'ja' : 'nein') + ' Sensor: ' + (hasSensors ? 'ja' : 'nein'));
  log('Fenster: ' + window.innerWidth + 'x' + window.innerHeight);

  // ---------- Kugel (Canvas 2D) ----------
  var N = 70, pts = [], edges = [];
  var golden = Math.PI * (3 - Math.sqrt(5));
  for (var i = 0; i < N; i++) {
    var y = 1 - (i / (N - 1)) * 2;
    var r = Math.sqrt(1 - y * y);
    var th = golden * i;
    pts.push({ x: Math.cos(th) * r, y: y, z: Math.sin(th) * r });
  }
  for (var a = 0; a < N; a++) {
    for (var b = a + 1; b < N; b++) {
      var dx = pts[a].x - pts[b].x, dy = pts[a].y - pts[b].y, dz = pts[a].z - pts[b].z;
      if (Math.sqrt(dx * dx + dy * dy + dz * dz) < 0.52) edges.push([a, b]);
    }
  }

  var CX = W / 2, CY = 118, R = 70;
  var rot = 0;
  var energy = 0;        // 0 = ruhig, 1 = aktiv
  var targetEnergy = 0;
  var micLevel = 0;      // 0..1
  var holding = false;

  function draw(time) {
    energy += (targetEnergy - energy) * 0.08;
    rot += 0.006 + energy * 0.02;
    var breathe = 1 + Math.sin(time / 900) * 0.02 + energy * (0.06 + micLevel * 0.25) * Math.sin(time / 120);
    var rad = R * breathe;

    ctx.clearRect(0, 0, W, H);

    // Glühen
    var g = ctx.createRadialGradient(CX, CY, rad * 0.2, CX, CY, rad * 1.5);
    g.addColorStop(0, 'rgba(90,170,255,' + (0.10 + energy * 0.18) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, 240);

    // Drehung
    var cr = Math.cos(rot), sr = Math.sin(rot);
    var ct = Math.cos(0.4), st = Math.sin(0.4);
    var p2 = new Array(N);
    for (var i = 0; i < N; i++) {
      var p = pts[i];
      var x = p.x * cr + p.z * sr;
      var z = -p.x * sr + p.z * cr;
      var y = p.y * ct - z * st;
      z = p.y * st + z * ct;
      p2[i] = { x: CX + x * rad, y: CY + y * rad, z: z };
    }

    // Linien
    ctx.lineWidth = 1;
    for (var e = 0; e < edges.length; e++) {
      var A = p2[edges[e][0]], B = p2[edges[e][1]];
      var d = (A.z + B.z) / 2;
      var alpha = 0.10 + (d + 1) * 0.18 + energy * 0.25;
      ctx.strokeStyle = 'rgba(120,190,255,' + alpha.toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(A.x, A.y);
      ctx.lineTo(B.x, B.y);
      ctx.stroke();
    }
    // Knoten
    for (var j = 0; j < N; j++) {
      var q = p2[j];
      var a2 = 0.25 + (q.z + 1) * 0.35 + energy * 0.3;
      ctx.fillStyle = 'rgba(190,225,255,' + Math.min(1, a2).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(q.x, q.y, 1.4 + (q.z + 1) * 0.5, 0, 6.283);
      ctx.fill();
    }

    // Mikrofon-Pegel
    var barY = 206, barW = 200, barX = (W - barW) / 2;
    ctx.strokeStyle = 'rgba(120,144,156,0.6)';
    ctx.strokeRect(barX, barY, barW, 5);
    ctx.fillStyle = holding ? 'rgba(120,255,170,0.9)' : 'rgba(120,144,156,0.4)';
    ctx.fillRect(barX + 1, barY + 1, Math.max(0, Math.min(1, micLevel)) * (barW - 2), 3);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // ---------- Mikrofon ----------
  var stream = null, audioCtx = null, analyser = null, buf = null, micTimer = null;

  function startMic() {
    if (!hasMic) { log('Mikro: API fehlt'); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      if (!holding) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
      stream = s;
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      var src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      buf = new Uint8Array(analyser.fftSize);
      src.connect(analyser);
      log('Mikro: laeuft');
      micTimer = setInterval(function () {
        analyser.getByteTimeDomainData(buf);
        var sum = 0;
        for (var i = 0; i < buf.length; i++) { var v = (buf[i] - 128) / 128; sum += v * v; }
        var rms = Math.sqrt(sum / buf.length);
        micLevel = Math.min(1, rms * 6);
      }, 50);
    }).catch(function (err) {
      log('Mikro Fehler: ' + (err && err.name ? err.name : err));
    });
  }

  function stopMic() {
    if (micTimer) { clearInterval(micTimer); micTimer = null; }
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
    micLevel = 0;
  }

  // ---------- Knopf-Ereignisse ----------
  function onHoldStart(src) {
    if (holding) return;
    holding = true;
    targetEnergy = 1;
    log('Halten Start (' + src + ')');
    startMic();
  }
  function onHoldEnd(src) {
    holding = false;
    targetEnergy = 0;
    log('Halten Ende (' + src + ')');
    stopMic();
  }

  window.addEventListener('longPressStart', function () { onHoldStart('R1'); });
  window.addEventListener('longPressEnd', function () { onHoldEnd('R1'); });
  window.addEventListener('sideClick', function () { log('sideClick'); });
  window.addEventListener('scrollUp', function () { log('scrollUp'); });
  window.addEventListener('scrollDown', function () { log('scrollDown'); });

  // Zum Testen am PC: Leertaste halten
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); onHoldStart('Leertaste'); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'Space') { e.preventDefault(); onHoldEnd('Leertaste'); }
  });

  window.addEventListener('error', function (e) { log('Fehler: ' + e.message); });
})();
</script>
</body>
</html>
