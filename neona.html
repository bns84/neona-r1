<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, height=292, initial-scale=1, user-scalable=no">
<title>Neona</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #cfd8dc; overflow: hidden; }
  body { width: 240px; height: 292px; position: relative; font-family: system-ui, sans-serif; }
  canvas { position: absolute; left: 0; top: 0; width: 240px; height: 292px; }
  #state { position: absolute; left: 4px; top: 2px; font-size: 9px; color: #78909c; }
  #txt { position: absolute; left: 6px; right: 6px; top: 150px; height: 138px; font-size: 13px; line-height: 16px; color: #e3f2fd; overflow: hidden; }
  #you { color: #78909c; font-size: 10px; line-height: 12px; margin-bottom: 3px; }
</style>
</head>
<body>
<canvas id="c" width="240" height="292"></canvas>
<div id="state">Neona</div>
<div id="txt"><div id="you"></div><div id="ans"></div></div>

<script>
(function () {
  var W = 240, H = 292;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var stateEl = document.getElementById('state');
  var youEl = document.getElementById('you');
  var ansEl = document.getElementById('ans');

  var params = new URLSearchParams(location.search);
  var SERVER = (params.get('server') || '').replace(/\/+$/, '');
  var TOKEN = params.get('token') || '';

  // ---------- Kugel (Canvas 2D) ----------
  var N = 60, pts = [], edges = [];
  var golden = Math.PI * (3 - Math.sqrt(5));
  for (var i = 0; i < N; i++) {
    var y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = golden * i;
    pts.push({ x: Math.cos(th) * r, y: y, z: Math.sin(th) * r });
  }
  for (var a = 0; a < N; a++) for (var b = a + 1; b < N; b++) {
    var dx = pts[a].x - pts[b].x, dy = pts[a].y - pts[b].y, dz = pts[a].z - pts[b].z;
    if (Math.sqrt(dx * dx + dy * dy + dz * dz) < 0.56) edges.push([a, b]);
  }

  var mode = 'idle';              // idle | listening | thinking | answering
  var energy = 0, targetEnergy = 0, rot = 0;
  var CX = W / 2, CY = 72, R = 50;

  function setMode(m, label) {
    mode = m;
    stateEl.textContent = label || m;
    targetEnergy = (m === 'listening') ? 1 : (m === 'thinking') ? 0.6 : (m === 'answering') ? 0.35 : 0;
  }

  function draw(time) {
    energy += (targetEnergy - energy) * 0.08;
    var speed = mode === 'thinking' ? 0.03 : 0.006 + energy * 0.02;
    rot += speed;
    var pulse = mode === 'listening' ? (0.5 + 0.5 * Math.sin(time / 140)) * 0.08 : 0;
    var breathe = 1 + Math.sin(time / 900) * 0.02 + energy * 0.05 + pulse;
    var rad = R * breathe;
    ctx.clearRect(0, 0, W, H);

    var g = ctx.createRadialGradient(CX, CY, rad * 0.2, CX, CY, rad * 1.5);
    var col = mode === 'thinking' ? '255,200,120' : '90,170,255';
    g.addColorStop(0, 'rgba(' + col + ',' + (0.10 + energy * 0.18) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, 148);

    var cr = Math.cos(rot), sr = Math.sin(rot), ct = Math.cos(0.4), st = Math.sin(0.4);
    var p2 = new Array(N);
    for (var i = 0; i < N; i++) {
      var p = pts[i];
      var x = p.x * cr + p.z * sr, z = -p.x * sr + p.z * cr;
      var y = p.y * ct - z * st; z = p.y * st + z * ct;
      p2[i] = { x: CX + x * rad, y: CY + y * rad, z: z };
    }
    ctx.lineWidth = 1;
    var lc = mode === 'thinking' ? '255,210,140' : '120,190,255';
    for (var e = 0; e < edges.length; e++) {
      var A = p2[edges[e][0]], B = p2[edges[e][1]];
      var al = 0.10 + ((A.z + B.z) / 2 + 1) * 0.18 + energy * 0.25;
      ctx.strokeStyle = 'rgba(' + lc + ',' + al.toFixed(3) + ')';
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
    }
    for (var j = 0; j < N; j++) {
      var q = p2[j];
      ctx.fillStyle = 'rgba(200,228,255,' + Math.min(1, 0.25 + (q.z + 1) * 0.35 + energy * 0.3).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(q.x, q.y, 1.3 + (q.z + 1) * 0.5, 0, 6.283); ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // ---------- Antwort holen ----------
  function ask(text) {
    if (!SERVER || !TOKEN) {
      setMode('idle', 'kein Server/Token');
      ansEl.textContent = 'Erkannt, aber kein Server in der Adresse.';
      return;
    }
    setMode('thinking', 'denke nach');
    fetch(SERVER + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Neona-Key': TOKEN },
      body: JSON.stringify({ text: text })
    })
      .then(function (r) {
        if (!r.ok) return r.text().then(function (t) { throw new Error(r.status + ' ' + t.slice(0, 120)); });
        return r.json();
      })
      .then(function (j) {
        ansEl.textContent = j.answer || '';
        setMode('answering', 'Antwort');
        setTimeout(function () { if (mode === 'answering') setMode('idle', 'bereit'); }, 8000);
      })
      .catch(function (err) {
        ansEl.textContent = 'Fehler: ' + err.message;
        setMode('idle', 'Fehler');
      });
  }

  // ---------- Sprache ueber die eingebaute R1-Bruecke ----------
  var listening = false, waitTimer = null;

  function start() {
    if (listening || mode === 'thinking') return;
    if (typeof CreationVoiceHandler === 'undefined') { setMode('idle', 'Sprach-Bruecke fehlt'); return; }
    listening = true;
    youEl.textContent = ''; ansEl.textContent = '';
    setMode('listening', 'hoere zu');
    try { CreationVoiceHandler.postMessage('start'); } catch (e) { listening = false; setMode('idle', 'Fehler start'); }
  }
  function stop() {
    if (!listening) return;
    setMode('thinking', 'verstehe');
    try { CreationVoiceHandler.postMessage('stop'); } catch (e) {}
    waitTimer = setTimeout(function () {
      if (listening) { listening = false; setMode('idle', 'keine Antwort vom R1'); }
    }, 8000);
  }

  window.onPluginMessage = function (data) {
    var d = data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) {} }
    if (!d || d.type !== 'sttEnded') return;
    listening = false;
    if (waitTimer) { clearTimeout(waitTimer); waitTimer = null; }
    var t = ((d.transcript || '') + '').trim();
    if (!t) { setMode('idle', 'nichts verstanden'); return; }
    youEl.textContent = 'Du: ' + t;
    ask(t);
  };

  window.addEventListener('longPressStart', start);
  window.addEventListener('longPressEnd', stop);
  window.addEventListener('keydown', function (e) { if (e.code === 'Space' && !e.repeat) { e.preventDefault(); start(); } });
  window.addEventListener('keyup', function (e) { if (e.code === 'Space') { e.preventDefault(); stop(); } });
  window.addEventListener('error', function (e) { ansEl.textContent = 'Fehler: ' + e.message; });

  setMode('idle', SERVER ? 'bereit' : 'bereit (ohne Server)');
})();
</script>
</body>
</html>
